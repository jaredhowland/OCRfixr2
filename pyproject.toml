[project]
name = "OCRfixr"
version = "2.0.0"
description = "A contextual spellchecker for OCR output"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
  {name = "Jack McMahon", email = "OCRfixr@mcmahon.work"},
  {name = "Jared Howland", email = "OCRfixr@jaredhowland.com"},
]
maintainers = [
  {name = "Jared Howland", email = "OCRfixr@jaredhowland.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = [
    'ocrfixr','spellcheck', 'OCR', 'contextual', 'BERT'
]
requires-python = ">=3.12"
dependencies = [
    "importlib-resources>=7.1.0",
    "metaphone>=0.6",
    "numpy>=2.4.4",
    "symspellpy>=6.9.0",
    "tensorflow>=2.21.0",
    "tqdm>=4.67.3",
    "transformers>=5.6.2",
]

[project.urls]
"Repository" = "https://github.com/jaredhowland/OCRfixr"

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"

[project]
name = "ocrfixr2"
version = "2.0.0"
description = "A contextual spellchecker for OCR output"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
  {name = "Jack McMahon", email = "OCRfixr@mcmahon.work"},
  {name = "Jared Howland", email = "OCRfixr2@jaredhowland.com"},
]
maintainers = [
  {name = "Jared Howland", email = "OCRfixr2@jaredhowland.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = [
    'ocrfixr','ocrfixr2','spellcheck', 'OCR', 'contextual', 'BERT'
]
requires-python = ">=3.12"
dependencies = [
    "guiguts>=2.0.22",
    "metaphone>=0.6",
    "numpy>=2.4.4",
    "symspellpy>=6.9.0",
    "tensorflow>=2.21.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=5.6.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
ocrfixr2 = "ocrfixr2.run_ocrfixr:main"

[project.urls]
"Repository" = "https://github.com/jaredhowland/OCRfixr2"

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"
